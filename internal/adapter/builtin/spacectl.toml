name = "spacectl"
bin  = "spacectl"
kind = "env-token"
# spacectl tries SPACELIFT_API_TOKEN before API keys and then ignores them.
unset_env = ["SPACELIFT_API_TOKEN"]

[[secret]]
env   = "SPACELIFT_API_KEY_ENDPOINT"
label = "Spacelift Endpoint"
plain = true

[[secret]]
env   = "SPACELIFT_API_KEY_ID"
label = "Spacelift API Key ID"

[[secret]]
env   = "SPACELIFT_API_KEY_SECRET"
label = "Spacelift API Secret"

[login]
hint = "Create an API key in your Spacelift account (Settings → API keys)"
